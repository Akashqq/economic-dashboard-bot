name: Automated AI Market Dashboard Updater

on:
  schedule:
    - cron: '0 8 * * *' # Runs everyday at 8:00 AM UTC
  workflow_dispatch: # Allows you to run it manually anytime from GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Analysis Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_market.py

      - name: Commit and Push Updated Data Back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.json
          git commit -m "Auto-update market indicator data via Gemini AI [skip ci]" || exit 0
          git push
